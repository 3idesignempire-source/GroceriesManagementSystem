<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Grocery Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-600 to-indigo-800 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <h1 class="text-2xl font-bold text-center mb-6">Grocery Manager Login</h1>
            <div id="loginError" class="hidden bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-center text-sm">Invalid Credentials!</div>
            <input type="text" id="username" value="admin" class="w-full px-4 py-2 border rounded-lg mb-4 outline-none" placeholder="Username">
            <input type="password" id="password" value="12345" class="w-full px-4 py-2 border rounded-lg mb-4 outline-none" placeholder="Password">
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700">Login</button>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="mainApp" class="hidden min-h-screen">
        <header class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-50">
            <h2 class="font-bold text-xl">My Groceries</h2>
            <div class="space-x-2">
                <button onclick="switchTab('dashboard')" class="px-3 py-1 bg-blue-100 text-blue-700 rounded-lg text-sm font-bold">Home</button>
                <button onclick="switchTab('config')" class="px-3 py-1 bg-gray-100 rounded-lg text-sm font-bold">Config</button>
                <button onclick="handleLogout()" class="text-red-500"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <main class="max-w-xl mx-auto p-4 space-y-4">
            
            <!-- CONFIG TAB -->
            <div id="configTab" class="hidden space-y-4">
                <div class="bg-white p-4 rounded-xl shadow border">
                    <h4 class="font-bold mb-2">Shops</h4>
                    <div class="flex gap-2"><input type="text" id="shopInput" class="border p-2 w-full rounded" placeholder="New Shop"><button onclick="addShop()" class="bg-blue-600 text-white px-4 rounded">Add</button></div>
                    <div id="shopList" class="mt-2 text-sm text-gray-600"></div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow border">
                    <h4 class="font-bold mb-2">Groceries</h4>
                    <input type="text" id="groceryNameInput" class="border p-2 w-full rounded mb-2" placeholder="Grocery Name">
                    <select id="groceryShopSelect" class="border p-2 w-full rounded mb-2"></select>
                    <button onclick="addGrocery()" class="w-full bg-green-600 text-white p-2 rounded">Add Item</button>
                    <table class="w-full mt-4 text-sm"><tbody id="masterGroceryList"></tbody></table>
                </div>
            </div>

            <!-- DASHBOARD TAB -->
            <div id="dashboardTab" class="space-y-4">
                <!-- Search Box Top -->
                <div class="bg-white p-4 rounded-xl shadow border">
                    <input type="text" id="searchGroceryInput" oninput="renderDashboard()" placeholder="Search grocery item..." class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Horizontal Line -->
                <hr class="border-t-2 border-gray-300">

                <!-- Filters Box -->
                <div class="bg-white p-4 rounded-xl shadow border space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <select id="filterShopSelect" onchange="renderDashboard()" class="p-2 border rounded text-sm"></select>
                        <select id="filterDaysSelect" onchange="renderDashboard()" class="p-2 border rounded text-sm">
                            <option value="ALL">All Days</option>
                            <option value="0-10">0 to 10 Days</option>
                            <option value="10">More than 10 Days</option>
                            <option value="20">More than 20 Days</option>
                            <option value="30">More than 30 Days</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <select id="sortDaysSelect" onchange="renderDashboard()" class="p-2 border rounded text-sm">
                            <option value="asc">Low to High</option>
                            <option value="desc">High to Low</option>
                        </select>
                        <label class="flex items-center space-x-2 bg-amber-50 p-2 rounded border border-amber-200">
                            <input type="checkbox" id="readyToBuyFilter" onchange="renderDashboard()"> <span class="text-sm font-bold">Ready to Buy</span>
                        </label>
                    </div>
                </div>

                <div id="dashboardGroceryList" class="space-y-3"></div>
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC4m2lTvc9nzvl4Rp0kwRfBuFS64_c_j1I",
            authDomain: "groceriesmanagementsystem.firebaseapp.com",
            databaseURL: "https://groceriesmanagementsystem-default-rtdb.firebaseio.com",
            projectId: "groceriesmanagementsystem",
            storageBucket: "groceriesmanagementsystem.firebasestorage.app",
            messagingSenderId: "827574928434",
            appId: "1:827574928434:web:d63c22e4f194389f74282b",
            measurementId: "G-2XTDJ3EG4X"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let appData = { shops: [], groceries: [] };

        function fetchFirebaseData() {
            db.ref('groceryData').once('value', s => {
                const data = s.val() || {};
                appData.shops = data.shops || [];
                appData.groceries = data.groceries || [];
                initApp();
            });
        }
        function saveFirebaseData() { db.ref('groceryData').set(appData); }

        function handleLogin() {
            if(document.getElementById('username').value === 'admin' && document.getElementById('password').value === '12345') {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                fetchFirebaseData();
            } else { document.getElementById('loginError').classList.remove('hidden'); }
        }

        function handleLogout() { location.reload(); }

        function initApp() { updateDropdowns(); renderConfigShops(); renderMasterGroceries(); renderDashboard(); }

        function switchTab(t) {
            document.getElementById('dashboardTab').classList.toggle('hidden', t !== 'dashboard');
            document.getElementById('configTab').classList.toggle('hidden', t !== 'config');
        }

        function updateDropdowns() {
            const s = document.getElementById('groceryShopSelect'), f = document.getElementById('filterShopSelect');
            let opts = '<option value="ALL">All Shops</option>';
            appData.shops.forEach(sh => opts += `<option value="${sh}">${sh}</option>`);
            s.innerHTML = opts.replace('All Shops', 'Select Shop');
            f.innerHTML = opts;
        }

        function addShop() {
            const v = document.getElementById('shopInput').value.trim();
            if(v && !appData.shops.includes(v)) { appData.shops.push(v); saveFirebaseData(); updateDropdowns(); renderConfigShops(); }
        }

        function addGrocery() {
            const name = document.getElementById('groceryNameInput').value.trim();
            const shop = document.getElementById('groceryShopSelect').value;
            if(name && shop) {
                appData.groceries.push({ id: String(Date.now()), name, shop, lastPurchasedDate: new Date().toISOString().split('T')[0], quantity: "", readyToBuy: false });
                saveFirebaseData(); renderMasterGroceries(); renderDashboard();
            }
        }

        function updatePurchaseInfo(id, newDate, newQty) {
            const item = appData.groceries.find(g => String(g.id) === String(id));
            if (item) {
                if (newDate !== undefined) item.lastPurchasedDate = newDate;
                if (newQty !== undefined) item.quantity = newQty;
                saveFirebaseData();
            }
        }

        function renderDashboard() {
            const container = document.getElementById('dashboardGroceryList');
            const search = document.getElementById('searchGroceryInput').value.toLowerCase();
            const shop = document.getElementById('filterShopSelect').value;
            const days = document.getElementById('filterDaysSelect').value;
            const sort = document.getElementById('sortDaysSelect').value;
            const ready = document.getElementById('readyToBuyFilter').checked;
            
            container.innerHTML = '';
            let list = appData.groceries.filter(i => (search === '' || i.name.toLowerCase().includes(search)) && (shop === 'ALL' || i.shop === shop) && (!ready || i.readyToBuy));
            
            list.sort((a,b) => {
                let dA = (new Date() - new Date(a.lastPurchasedDate)) / 86400000, dB = (new Date() - new Date(b.lastPurchasedDate)) / 86400000;
                return sort === 'asc' ? dA - dB : dB - dA;
            });

            list.forEach(i => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow border";
                card.innerHTML = `<h4 class="font-bold">${i.name}</h4><div class="flex gap-2 text-xs mt-2"><input type="date" value="${i.lastPurchasedDate}" class="border p-1 date-input"><input type="text" value="${i.quantity}" placeholder="Qty" class="border p-1 w-20 qty-input"></div>`;
                card.querySelector('.date-input').addEventListener('change', (e) => updatePurchaseInfo(i.id, e.target.value, undefined));
                card.querySelector('.qty-input').addEventListener('input', (e) => updatePurchaseInfo(i.id, undefined, e.target.value));
                container.appendChild(card);
            });
        }

        function renderConfigShops() { /* Same logic as before */ }
        function renderMasterGroceries() { /* Same logic as before */ }
    </script>
</body>
</html>
