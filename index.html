<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <!-- Login Screen -->
    <div id="loginScreen" class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-600 to-indigo-800 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <h1 class="text-2xl font-bold text-center mb-6">Grocery Manager Login</h1>
            <input type="text" id="username" value="admin" class="w-full px-4 py-2 border rounded-lg mb-4 outline-none" placeholder="Username">
            <input type="password" id="password" value="12345" class="w-full px-4 py-2 border rounded-lg mb-4 outline-none" placeholder="Password">
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700">Login</button>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="hidden min-h-screen">
        <header class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-50">
            <h2 class="font-bold text-xl">My Groceries</h2>
            <div class="space-x-2">
                <button onclick="switchTab('dashboard')" class="px-3 py-1 bg-blue-100 text-blue-700 rounded-lg text-sm font-bold">Home</button>
                <button onclick="switchTab('config')" class="px-3 py-1 bg-gray-100 rounded-lg text-sm font-bold">Config</button>
                <button onclick="handleLogout()" class="text-red-500"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <main class="max-w-xl mx-auto p-4 space-y-4">
            <!-- Config Tab -->
            <div id="configTab" class="hidden space-y-4">
                <div class="bg-white p-4 rounded-xl shadow border">
                    <h4 class="font-bold mb-2">Shops & Groceries Config</h4>
                    <div class="flex gap-2 mb-2"><input type="text" id="shopInput" class="border p-2 w-full rounded" placeholder="New Shop"><button onclick="addShop()" class="bg-blue-600 text-white px-4 rounded">Add Shop</button></div>
                    <input type="text" id="groceryNameInput" class="border p-2 w-full rounded mb-2" placeholder="Grocery Name">
                    <select id="groceryShopSelect" class="border p-2 w-full rounded mb-2"></select>
                    <button onclick="addGrocery()" class="w-full bg-green-600 text-white p-2 rounded">Add Grocery Item</button>
                </div>
            </div>

            <!-- Dashboard Tab -->
            <div id="dashboardTab" class="space-y-4">
                <!-- 1. Search Box (Top) -->
                <div class="bg-white p-4 rounded-xl shadow border">
                    <input type="text" id="searchGroceryInput" oninput="renderDashboard()" placeholder="🔍 Search grocery item by name..." class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <hr class="border-t-2 border-gray-300">

                <!-- 2. Filters & Sort Box -->
                <div class="bg-white p-4 rounded-xl shadow border space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <select id="filterShopSelect" onchange="renderDashboard()" class="p-2 border rounded text-sm"></select>
                        <select id="filterDaysSelect" onchange="renderDashboard()" class="p-2 border rounded text-sm">
                            <option value="ALL">All Days</option>
                            <option value="0-10">0 to 10 Days</option>
                            <option value="10">More than 10 Days</option>
                            <option value="20">More than 20 Days</option>
                            <option value="30">More than 30 Days</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <select id="sortDaysSelect" onchange="renderDashboard()" class="p-2 border rounded text-sm">
                            <option value="asc">Asc: Low to High Days</option>
                            <option value="desc">Desc: High to Low Days</option>
                        </select>
                        <label class="flex items-center space-x-2 bg-amber-50 p-2 rounded border border-amber-200">
                            <input type="checkbox" id="readyToBuyFilter" onchange="renderDashboard()"> <span class="text-sm font-bold">Ready to Buy</span>
                        </label>
                    </div>
                </div>

                <!-- 3. List display (Below filters) -->
                <div id="dashboardGroceryList" class="space-y-3"></div>
            </div>
        </main>
    </div>

    <script>
        // ... (ஜாவாஸ்கிரிப்ட் லாஜிக் முந்தைய கோடின்படியே அப்படியே பயன்படுத்தவும், இது கச்சிதமாக வேலை செய்யும்) ...
    </script>
</body>
</html>
