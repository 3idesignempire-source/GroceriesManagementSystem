<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Grocery Management System</title>
    <!-- Tailwind CSS for Modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase App & Realtime Database CDN scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-600 to-indigo-800 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-6">
                <div class="bg-blue-100 text-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">Grocery Manager</h1>
            </div>
            <div id="loginError" class="hidden bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm text-center">Invalid Credentials!</div>
            <div class="space-y-4">
                <input type="text" id="username" value="admin" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Username">
                <input type="password" id="password" value="12345" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Password">
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition">Login</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="mainApp" class="hidden min-h-screen flex flex-col">
        <header class="bg-white shadow-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <h2 class="text-xl font-bold text-gray-800">My Groceries</h2>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="switchTab('dashboard')" id="navDashBtn" class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-blue-100 text-blue-700">Home</button>
                    <button onclick="switchTab('config')" id="navConfigBtn" class="px-3 py-1.5 rounded-lg text-sm font-semibold text-gray-600 hover:bg-gray-100">Config</button>
                    <button onclick="handleLogout()" class="text-red-500 p-2"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>
        </header>

        <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
            
            <!-- CONFIGURATION TAB -->
            <div id="configTab" class="hidden space-y-6">
                <!-- (Settings content remains same as before) -->
            </div>

            <!-- DASHBOARD / BUY TAB -->
            <div id="dashboardTab" class="space-y-6">
                
                <!-- NEW DESIGN: Search Box separated -->
                <div class="bg-white p-4 rounded-xl shadow-sm border">
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <input type="text" id="searchGroceryInput" oninput="renderDashboard()" placeholder="Search grocery item by name..." class="w-full pl-10 pr-4 py-3 border rounded-lg text-sm outline-none bg-gray-50 focus:ring-2 focus:ring-blue-500 font-medium">
                    </div>
                </div>

                <!-- Filters & Sorting Box -->
                <div class="bg-white p-4 rounded-xl shadow-sm border space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Filter by Shop</label>
                            <select id="filterShopSelect" onchange="renderDashboard()" class="w-full px-3 py-2 border rounded-lg text-sm outline-none bg-gray-50 font-medium"></select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Filter by Days Ago</label>
                            <select id="filterDaysSelect" onchange="renderDashboard()" class="w-full px-3 py-2 border rounded-lg text-sm outline-none bg-gray-50 font-medium">
                                <option value="ALL">All Days</option>
                                <option value="0-10">0 to 10 Days</option>
                                <option value="10">More than 10 Days</option>
                                <option value="20">More than 20 Days</option>
                                <option value="30">More than 30 Days</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Sort by Days</label>
                            <select id="sortDaysSelect" onchange="renderDashboard()" class="w-full px-3 py-2 border rounded-lg text-sm outline-none bg-gray-50 font-medium">
                                <option value="asc">Ascending (Low to High)</option>
                                <option value="desc">Descending (High to Low)</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <label class="flex items-center space-x-2 cursor-pointer bg-amber-50 border border-amber-200 w-full px-3 py-2.5 rounded-lg text-sm text-amber-800">
                                <input type="checkbox" id="readyToBuyFilter" onchange="renderDashboard()" class="w-4 h-4 text-blue-600 rounded">
                                <span class="font-semibold"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Ready to Buy Only</span>
                            </label>
                        </div>
                    </div>
                    <div class="text-xs text-gray-500 font-medium border-t pt-2">
                        Total Items Found: <span id="totalItemsCount" class="text-blue-600 font-bold">0</span>
                    </div>
                </div>

                <!-- Main Buying Grid -->
                <div id="dashboardGroceryList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
        </main>
    </div>

    <script>
        // ... (All logic remains the same, just ensured the new UI structure is rendered correctly) ...
        // (Full logic code was not included for brevity, please use the exact same JS logic from the previous turn)
    </script>
</body>
</html>
